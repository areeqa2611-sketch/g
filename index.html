const SLOT_NAMES=Object.keys(STRUCT);
const GENERIC_WORLD=['日常','生活','遊び','買い物','移動','食事','ネット','人間関係','公共空間'];
let recentRoots=JSON.parse(localStorage.getItem('omoroRecentRoots')||'[]');
function vals(id){return document.getElementById(id).value}
function bans(){return vals('ban').split(/[、,，]/).map(x=>x.trim()).filter(Boolean)}
function isBanned(x){return bans().some(b=>String(x).includes(b))}
function filteredWorlds(){return WORLDS.filter(w=>!isBanned(w.root))}
function recentPenalty(root){let mode=vals('cooldown'),idx=recentRoots.indexOf(root);if(idx<0)return 1;let base=mode==='strong'?.05:mode==='medium'?.2:.5;return Math.min(1,base+idx*.05)}
function weightedPickWorld(list){let weighted=[];for(const w of list){let n=Math.max(1,Math.round(recentPenalty(w.root)*20));for(let i=0;i<n;i++)weighted.push(w)}return pick(weighted.length?weighted:list)}
function dynamicWorld(){let g=vals('genre');let cats=g==='random'?Object.keys(EXTRA_ROOTS):[g];let pool=cats.flatMap(k=>(EXTRA_ROOTS[k]||[]).map(root=>({root,kind:k}))).filter(w=>!isBanned(w.root));return weightedPickWorld(pool)}
function chooseWorld(){return dynamicWorld()}
function rememberRoot(root){recentRoots=[root,...recentRoots.filter(x=>x!==root)].slice(0,100);localStorage.setItem('omoroRecentRoots',JSON.stringify(recentRoots))}
function settings(){return {target:vals('target'),media:vals('media'),crew:vals('crew'),shoot:vals('shoot'),genre:vals('genre'),format:vals('format'),dist:+vals('dist'),empathy:+vals('empathy'),silly:+vals('silly'),feasible:+vals('feasible'),testable:+vals('testable'),expert:+vals('expert'),chaos:+vals('chaos'),complexity:+vals('complexity'),budget:vals('budget'),duration:vals('duration'),cooldown:vals('cooldown'),fixed:vals('fixed'),ban:vals('ban'),num:vals('num')}}
function seedIdea(){
 const w=chooseWorld(),d=+vals('dist'),fixed=vals('fixed').trim();
 let count=d<=2?3:d===3?4:d===4?5:6;
 let slots=[...SLOT_NAMES].sort(()=>Math.random()-.5).slice(0,count);
 // 「専門家」「会社」「損得」等の便利テンプレは構造部品に置かない。
 let parts=slots.map(k=>`${k}:${pick(STRUCT[k])}`);
 if(fixed)parts.splice(1,0,`固定:${fixed}`);
 // 距離が高い時だけ別カテゴリの第二概念を衝突させる。毎回は使わない。
 if(d>=4 && Math.random()<.65){let other=dynamicWorld();if(other.root!==w.root)parts.push(`第二概念:${other.root}`)}
 return {root:w.root,seed:`中心:${w.root} | `+parts.join(' | '),mat:[w.root,...parts],structure:slots};
}
function instructionText(){let s=settings();return `媒体:${s.media} / 制作体制:${s.crew} / 撮影方法:${s.shoot} / 形式:${s.format} / 共感性:${s.empathy}/5 / バカバカしさ:${s.silly}/5 / 実現性:${s.feasible}/5 / 検証可能性:${s.testable}/5 / 専門性:${s.expert}/5 / カオス上限:${s.chaos}/5 / 完成企画の複雑さ:${s.complexity}/5 / 予算:${s.budget} / 尺:${s.duration} / 除外:${s.ban||'なし'}`}
let recentOutputs=JSON.parse(localStorage.getItem('omoroRecentOutputs')||'[]');
function rememberOutput(x){const t=[x.title,x.concept,x.why].filter(Boolean).join(' / ');recentOutputs=[t,...recentOutputs.filter(y=>y!==t)].slice(0,20);localStorage.setItem('omoroRecentOutputs',JSON.stringify(recentOutputs))}
async function askGemini(raw,extra=''){const avoid=recentOutputs.slice(0,12).join(' || ');const target=`視聴ターゲット:${vals('target')}。これは企画の登場人物・職業・舞台を指定するものではない。ターゲットを会社員や専門家として企画内に登場させないこと。追加条件: ${instructionText()}。制作体制は企画テーマではなく実行上の制約として扱うこと。制作体制が「1人」の場合、撮影者本人1人だけで実行・撮影できる企画にする。共演者、対戦相手、仕掛け人、インタビュアー、撮影スタッフ、企画のために協力する専門家を必要条件にしない。ただし店員・通行人・一般客など、その場所に通常存在する第三者が映り込む・通常業務として応対する程度は可。「1人」を理由に、ぼっち・孤独・一人暮らし・友達がいない等を企画テーマにしない。撮影方法が指定されている場合は、その方法だけで現実的に撮影可能な構成にする。重要: 入力は固定テンプレートではなく、今回だけ抽選された因果構造である。内部探索の素材が多くても完成企画へ全部盛り込まないこと。最も効く2〜3要素だけを選び、残りは捨てて、一読で何をする企画か分かる一つの行動・現象へ圧縮すること。完成企画の複雑さが1〜2なら原則2要素、3なら2〜3要素、4〜5でも必要最小限にする。タイトルは原則15〜35文字程度、最大40文字を目安とし、短く自然に成立するなら15文字未満でもよい。文字数合わせの水増しは禁止。タイトルに背景・理由・細かい条件・結論を詰め込まず、企画の主動作と面白さの核が伝わる範囲にする。発想経路にない場所・職業・商品・生活場面を安易に補わない。『会社』『仕事』『専門家』『プロ』『損した気分』『得した気分』は入力に明示されていない限り追加禁止。特に同じ具体語を繰り返さない。直近の企画で使った表現・具体語は可能な限り再利用しない: ${avoid||'なし'}。${extra}`;const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seed:raw.seed,target,distance:+vals('dist')})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data?.detail?.error?.message||data?.error||('HTTP '+r.status));return {...data,root:raw.root,seed:raw.seed,mat:raw.mat}}
async function generate(){const n=+vals('num'),cards=document.getElementById('cards');cards.innerHTML='<div class="panel empty">Geminiが企画を構成中…<br><span class="count">ランダム探索 → 意味接続 → 成立判定</span></div>';const out=[];let tries=0;try{while(out.length<n&&tries<n*4){const batch=Array.from({length:Math.min(5,n-out.length+2)},()=>seedIdea());tries+=batch.length;const rs=await Promise.all(batch.map(x=>askGemini(x).catch(e=>({error:e.message,seed:x.seed}))));for(const x of rs){if(x.valid&&x.title&&!out.some(y=>y.title===x.title)&&!isBanned(x.title+' '+x.concept)){out.push(x);rememberRoot(x.root);rememberOutput(x)}if(out.length>=n)break}}if(!out.length)throw new Error('成立した企画が返りませんでした');render(out.slice(0,n))}catch(e){cards.innerHTML=`<div class="panel empty"><b>生成できませんでした</b><br>${esc(e.message)}<br><br><span class="count">Worker・Gemini無料枠・通信状態を確認。</span></div>`}}
const PRESET_KEY='omoroPresetsV06';
function presets(){return JSON.parse(localStorage.getItem(PRESET_KEY)||'{}')}
function refreshPresets(){let p=presets(),sel=document.getElementById('preset'),cur=sel.value;sel.innerHTML='<option value="">未選択</option>'+Object.keys(p).map(n=>`<option>${esc(n)}</option>`).join('');if(p[cur])sel.value=cur}
function applySettings(s){for(const [k,v] of Object.entries(s)){let el=document.getElementById(k);if(el)el.value=v}syncRanges()}
function savePreset(){let name=prompt('プリセット名');if(!name)return;let p=presets();p[name]=settings();localStorage.setItem(PRESET_KEY,JSON.stringify(p));refreshPresets();document.getElementById('preset').value=name;alert('プリセットを保存した')}
function loadPreset(){let n=vals('preset'),p=presets();if(!n||!p[n])return alert('プリセットを選んで');applySettings(p[n])}
function deletePreset(){let n=vals('preset');if(!n)return;if(!confirm(`「${n}」を削除する？`))return;let p=presets();delete p[n];localStorage.setItem(PRESET_KEY,JSON.stringify(p));refreshPresets()}
function syncRanges(){['dist','empathy','silly','feasible','testable','expert','chaos','complexity'].forEach(id=>{let e=document.getElementById(id),v=document.getElementById(id+'v');if(e&&v)v.textContent=e.value})}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function render(xs){
 document.getElementById('cards').innerHTML=xs.map((x,i)=>`<article class="card"><div class="title">${i+1}. ${esc(x.title)}</div><div class="why"><b>何をする？</b><br>${esc(x.concept||'')}</div><div class="why"><b>WHY</b><br>${esc(x.why||'')}</div>${x.hook?`<div class="material"><b>見たい瞬間:</b> ${esc(x.hook)}</div>`:''}${x.test?`<div class="material"><b>検証:</b> ${esc(x.test)}</div>`:''}<div class="material"><b>ランダム探索:</b> ${esc(x.seed)}</div>${x.path?`<div class="material"><b>接続:</b> ${esc(x.path)}</div>`:''}<div class="meta"><span class="chip">Gemini成立判定済み</span><span class="chip">発想距離 ${document.getElementById('dist').value}/5</span></div><div class="actions"><button class="btn ghost" onclick="mutate(${i})">🎲 変異</button><button class="btn ghost" onclick="remake(${i})">🔒 主柱固定</button><button class="btn ghost" onclick="saveIdea(${i})">♡ 保存</button></div></article>`).join(''); window.last=xs;
}
async function mutate(i){
 const a=window.last.slice(), raw=seedIdea(); raw.root=a[i]?.root||raw.root;
 const cards=document.getElementById('cards');
 try{const x=await askGemini(raw); if(!x.valid) throw new Error(x.reason||'不成立'); a[i]=x; render(a)}catch(e){alert('変異失敗: '+e.message)}
}
function savedIdeas(){return JSON.parse(localStorage.getItem('omoroSaved')||'[]')}
function updateSavedCount(){let e=document.getElementById('savedCount');if(e)e.textContent='('+savedIdeas().length+')'}
function saveIdea(i){let a=window.last[i],s=savedIdeas();s.unshift({...a,savedAt:new Date().toISOString(),savedSettings:settings()});localStorage.setItem('omoroSaved',JSON.stringify(s.slice(0,200)));updateSavedCount();alert('保存した')}
function showGenerated(){if(window.last?.length)render(window.last);else document.getElementById('cards').innerHTML='<div class="panel empty">まだ生成結果がないで。</div>'}
function showSaved(){let s=savedIdeas();updateSavedCount();if(!s.length){document.getElementById('cards').innerHTML='<div class="panel empty">保存した企画はまだない。</div>';return}document.getElementById('cards').innerHTML=s.map((x,i)=>`<article class="card"><div class="savedTop"><div class="title">${esc(x.title)}</div><button class="btn ghost" onclick="deleteSaved(${i})">削除</button></div><div class="why"><b>何をする？</b><br>${esc(x.concept||'')}</div><div class="why"><b>WHY</b><br>${esc(x.why||'')}</div>${x.hook?`<div class="material"><b>見たい瞬間:</b> ${esc(x.hook)}</div>`:''}${x.test?`<div class="material"><b>検証:</b> ${esc(x.test)}</div>`:''}<div class="savedMeta">保存: ${x.savedAt?new Date(x.savedAt).toLocaleString('ja-JP'):'旧バージョンから保存'}</div><div class="actions"><button class="btn ghost" onclick="remakeSaved(${i})">🔒 主柱固定リメイク</button></div></article>`).join('')}
function deleteSaved(i){if(!confirm('この企画を削除する？'))return;let s=savedIdeas();s.splice(i,1);localStorage.setItem('omoroSaved',JSON.stringify(s));showSaved()}
async function remake(i){return remakeIdea(window.last[i])}
async function remakeSaved(i){return remakeIdea(savedIdeas()[i])}
async function remakeIdea(base){if(!base)return;let pillar=prompt('この企画で絶対に変えたくない主柱を指定。\n空欄ならAIに元企画の主柱を抽出させる。','');if(pillar===null)return;let change=prompt('変えたい要素を指定して。\n例：人物を学生に／場所だけ変える／検証方法を対決に／低予算に','');if(change===null)return;let custom=prompt('追加条件があれば入力。なければ空欄でOK。','');if(custom===null)return;const raw={root:base.root||'リメイク',seed:`元企画タイトル: ${base.title} → 元企画内容: ${base.concept} → 元WHY: ${base.why||''}`};const extra=`主柱固定リメイク。元企画の面白さの核を保持すること。固定する主柱:${pillar||'元企画から最も重要な発想構造を1つ抽出して固定'}。変更してよい/変更する要素:${change||'周辺要素をランダムに変更'}。追加指定:${custom||'なし'}。主柱そのものを別企画へ変えてはいけない。`;document.getElementById('cards').innerHTML='<div class="panel empty">主柱を固定して作り直し中…</div>';try{let x=await askGemini(raw,extra);if(!x.valid)throw new Error(x.reason||'不成立');rememberOutput(x);render([x])}catch(e){alert('リメイク失敗: '+e.message);showGenerated()}}

['dist','empathy','silly','feasible','testable','expert','chaos','complexity'].forEach(id=>document.getElementById(id).oninput=syncRanges);refreshPresets();syncRanges();updateSavedCount();
const extraCount=Object.values(EXTRA_ROOTS).reduce((a,b)=>a+b.length,0);document.getElementById('dbcount').textContent=extraCount+'厳選入口語 / 8カテゴリ + Gemini';
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
